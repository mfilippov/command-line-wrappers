      - name: Test parallel start of uv.cmd and uvx.cmd
        run: |
          $GITHUB_WORKSPACE/uv.cmd --version & UV_PID=$!
          $GITHUB_WORKSPACE/uvx.cmd --version & UVX_PID=$!
          wait $UV_PID && wait $UVX_PID
      - name: Test script uv.cmd
        run: $GITHUB_WORKSPACE/uv.cmd --version
      - name: Test script uvx.cmd
        run: $GITHUB_WORKSPACE/uvx.cmd --version
  macos:
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      - name: Test script dotnet.cmd
        run: $GITHUB_WORKSPACE/dotnet.cmd --version
      - name: Test script java.cmd
